<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facturas Cloud</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

  <div class="container">
    
    <!-- 1. GRÁFICAS CON SELECTOR DE TIEMPO -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Días de Mayor Gasto</span>
        <select id="filtro-grafica" class="select-badge">
          <option value="mes">Este Mes</option>
          <option value="anio">Este Año</option>
          <option value="todo">Todo el tiempo</option>
        </select>
      </div>
      <div id="chart-dias"></div>
      <p class="card-footer-desc">Distribución de compras por día según el periodo seleccionado.</p>
    </div>

    <!-- 2. RANKING DE PROVEEDORES -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Ranking Proveedores</span>
        <span class="tag-badge" id="total-acumulado">Q 0.00</span>
      </div>
      <div id="lista-proveedores-top"></div>
    </div>

    <!-- 3. FORMULARIO REGISTRO -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Registrar Factura</span>
      </div>

      <label for="input-file" class="btn-camera">📸 Foto Factura (OCR)</label>
      <input type="file" id="input-file" accept="image/*" capture="environment">
      <img id="preview-img" alt="Vista previa">
      <p id="loader">Leyendo datos con OCR...</p>

      <input type="text" id="prov-input" placeholder="Proveedor (Ej: Bimbo)">
      <input type="number" id="monto-input" step="0.01" placeholder="Monto (Q)">
      <input type="date" id="fecha-input">

      <button class="btn-submit" id="btn-guardar">Subir a la nube</button>
    </div>

    <!-- 4. HISTORIAL AGRUPADO POR PROVEEDOR (ACORDEÓN) -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Historial por Proveedor</span>
      </div>
      <p class="card-footer-desc" style="margin-top: -8px; margin-bottom: 12px;">
        Toca un proveedor para desplegar su lista de facturas.
      </p>
      <div id="historial-grupos"></div>
    </div>

  </div>

  <!-- MODAL: VISOR DE FOTO -->
  <div id="modal-visor" class="modal">
    <button class="btn-close" id="btn-cerrar-modal">✕</button>
    <img id="modal-img" class="modal-content" src="" alt="Factura Detalle">
    <div id="modal-text" class="modal-info"></div>
  </div>

  <!-- MODAL: EDITAR FACTURA -->
  <div id="modal-editar" class="modal">
    <div class="modal-card">
      <div class="card-header">
        <span class="card-title">Editar Factura</span>
        <button class="btn-close-inline" id="btn-cerrar-editar">✕</button>
      </div>
      <input type="hidden" id="edit-id">
      <label class="lbl-edit">Proveedor</label>
      <input type="text" id="edit-prov">
      <label class="lbl-edit">Monto (Q)</label>
      <input type="number" id="edit-monto" step="0.01">
      <label class="lbl-edit">Fecha</label>
      <input type="date" id="edit-fecha">

      <button class="btn-submit" id="btn-actualizar" style="margin-top: 16px;">Guardar Cambios</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
